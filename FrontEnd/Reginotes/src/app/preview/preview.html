<header>
  <div class="logo">
    <img class="logo-icon" src="Logo.png" alt="Logo" />
    <div class="logo-text">REGI<br />NOTES</div>
  </div>
  <div class="header-right">
    <button class="btn-icon" title="Logout" (click)="logout()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
    </button>
    <span class="username">{{ username }}</span>
    <div class="avatar"></div>
  </div>
</header>

<main>
  <div class="edit-header">
    <h1 class="rendered-title">{{ title }}</h1>
    <div class="preview-actions">
      <div class="preview-area" [innerHTML]="contentHtml"></div>
    </div>
    <div class="edit-btns">
      <button class="btn-icon edit" title="Edit" (click)="editNote()">
        <svg viewBox="0 0 24 24">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 113 3L12 10l-4 1 1-4L18.5 2.5z"/>
        </svg>
      </button>
      <button class="btn-icon delete" title="Delete" (click)="deleteNote()">
        <svg viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m5 0V4a2 2 0 012-2h2a2 2 0 012 2v2"/>
        </svg>
      </button>
      <button class="btn-icon home" title="Home" routerLink="/home">
        <svg viewBox="0 0 24 24">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </button>
    </div>
  </div>
</main>
