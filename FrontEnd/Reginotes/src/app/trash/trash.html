<header>
  <div class="logo">
    <img class="logo-icon" src="Logo.png" alt="Logo" />
    <div class="logo-text">REGI<br />NOTES</div>
  </div>
  <div class="header-right">
    <button class="btn-icon" title="Go home" (click)="router.navigate(['/home'])">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <button class="btn-icon" title="Logout" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
    <span class="username">{{ username }}</span>
    <div class="avatar"></div>
  </div>
</header>

<main>
  <div class="notes-header">
    <div class="section-heading">TRASH</div>
  </div>

  <div class="notes-grid" id="notes">
    @for (note of notes; track note.id) {
      <div class="note-cell">
        <div class="file-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
        </div>
        <div class="card-meta">
          <div class="card-name">{{ note.title }}</div>
          <div class="card-date">{{ note.deletedAt | date: 'mediumDate' }}</div>
        </div>
        <div class="note-actions">
          <button class="btn-delete" title="Delete permanently" (click)="deletePermanently(note.id)">
            <svg viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" />
              <path d="M10 11v6M14 11v6" />
              <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2" />
            </svg>
          </button>
          <button class="btn-restore" title="Restore" (click)="restore(note.id)">
            <svg viewBox="0 0 24 24">
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 .49-4.95" />
            </svg>
          </button>
        </div>
      </div>
    }
  </div>

  <div class="pagination">
    <button class="btn-page" title="Previous" (click)="prevPage()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
    </button>
    <button class="btn-page" title="Next" (click)="nextPage()">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
    </button>
  </div>
</main>
