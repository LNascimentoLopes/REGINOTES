<main>
    <h1 class="welcome">REGI<br>NOTES</h1>
    <div class="content"> 
        
        <div class="logo">
            <img src="Logo.png">
        </div>
    
        <div class="login-form">
            <form (ngSubmit)="onSubmit()">

                <h1 class="form-title">LOGIN</h1>

                <input type="email" [(ngModel)]="email" name="email" required placeholder="Email">
        
                <input type="password" [(ngModel)]="password" name="password" required placeholder="Password">
                <p [hidden]="!errorMessage">{{ errorMessage }}</p>
                <button type="submit">Login</button>
                <a class="register-link" href="/register">Don't have an account? Register</a>
            </form>  
        </div>
    </div>   
</main>
