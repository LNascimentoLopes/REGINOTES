<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RegiNotes</title>
</head>
<body>
  <!-- ── HEADER ──────────────────────────────────── -->
  <header>
    <div class="logo">
      <img class="logo-icon" src="Logo.png" alt="Logo" />
      <div class="logo-text">REGI<br />NOTES</div>
    </div>
    <div class="header-right">
      <button class="btn-icon" title="Logout" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
      <span class="username">{{ username }}</span>
      <div class="avatar"></div>
    </div>
  </header>
  <!-- ── MAIN ────────────────────────────────────── -->
  <main>
    <div class="edit-header">
      <input type="text" class="edit-title" placeholder="Note title" [(ngModel)]="title" />
      <div class="edit-actions">
        <div class="editor">
          <textarea
            class="editor-area"
            placeholder="Start writing your note here..."
            [(ngModel)]="markdownContent"
          ></textarea>
        </div>
      </div>

      <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="edit-btns">
        <button class="btn-icon save" title="save" (click)="save()" [disabled]="isLoading">
          <svg viewBox="0 0 24 24">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" />
            <polyline points="17 21 17 13 7 13 7 21" />
          </svg>
        </button>
        <button class="btn-icon home" title="home" routerLink="/home">
          <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </button>
      </div>
    </div>
  </main>
</body>
