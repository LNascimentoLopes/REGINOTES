<main>
  <h1 class="welcome">REGI<br />NOTES</h1>
  <div class="content">
    <div class="logo">
      <img src="Logo.png" />
    </div>

    <div class="login-form">
      <form (ngSubmit)="onSubmit()">
        <h1 class="form-title">REGISTER</h1>

        <input type="text" [(ngModel)]="username" name="username" required placeholder="Username" />
        <input type="email" [(ngModel)]="email" name="email" required placeholder="Email" />
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Password"
        />
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirm-password"
          required
          placeholder="Confirm Password"
        />

        <p [hidden]="!error">{{ error }}</p>

        <button type="submit">REGISTER</button>
        <a class="register-link" href="/login">Already have an account? Login</a>
      </form>
    </div>
  </div>
</main>
