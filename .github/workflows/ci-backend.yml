name: Java CI with maven

on: 
  push:
    branches: [ "main","develop"]
  pull_request:
    branches: [ "main","develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notes_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432 
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run build and Maven tests
        working-directory: ./BackEnd/Note-Taking-app
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notes_db
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password

          JWT_SECRET: super_secret_key_apenas_para_o_teste_passar_123456789
          JWT_EXPIRATION_TIME: 900000
        run: mvn clean package

  deploy:
    needs: build
    runs-on: ubuntu:latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login on Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./BackEnd/Note-Taking-app
          push: true

          tags: lsnasc/note-taking-backend:latest
      
    
        
