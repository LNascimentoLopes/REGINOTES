
# A Ponte do Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notes_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}

# A Ponte do JWT (Variáveis customizadas suas)
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration = ${JWT_EXPIRATION_TIME}
# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework.security=TRACE

# Custom path for swagger UI (optional)
springdoc.swagger-ui.path=/swagger-ui.html

# Make sure it's enabled
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

springdoc.packagesToScan=LNascimento.Note_Taking_app
springdoc.pathsToMatch=/**

logging.level.org.springdoc=TRACE